[project]
name = "voice-to-hotkey"
dynamic = ["version"]
description = "Say a phrase, and your computer presses a hotkey"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "vosk",
    "PySide6-Essentials>=6.8",
    "PySide6-Addons>=6.8",
    "tomlkit",
    "evdev-binary; sys_platform == 'linux'",
    "pynput; sys_platform != 'linux'",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller", "pillow"]

[project.gui-scripts]
vth = "voice_to_hotkey.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "voice_to_hotkey.__version__" }

[tool.setuptools.package-data]
voice_to_hotkey = ["icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
