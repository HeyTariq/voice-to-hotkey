[project]
name = "ok-garmin"
version = "0.1.0"
description = "Tray app that presses a key when it hears a wake phrase"
requires-python = ">=3.11"
dependencies = [
    "vosk",
    "cffi",
    "evdev-binary",
    "PySide6",
]

[project.scripts]
ok-garmin = "ok_garmin.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
ok_garmin = ["icons/*.svg"]
